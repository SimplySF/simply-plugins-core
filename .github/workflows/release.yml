name: release

on:
  push:
    branches:
      - main
      - prerelease/**
    tags-ignore:
      - '**'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Prerelease identifier (beta, dev, etc). Leave blank to only publish already-tagged versions that are missing from npm.'
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: pnpm/setup@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm run build

      - run: pnpm test

      - name: Version (release)
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: pnpm exec lerna version --conventional-commits --create-release github --yes
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Version (prerelease)
        if: (github.event_name == 'push' && github.ref_name != 'main') || (github.event_name == 'workflow_dispatch' && inputs.prerelease)
        run: pnpm exec lerna version --conventional-commits --conventional-prerelease --preid "${{ inputs.prerelease || 'dev' }}" --create-release github --yes
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      # Publishes whatever versions are committed to git but still missing from npm. Deliberately
      # unconditional (not gated on the version steps above having run): this makes it self-healing
      # if a *previous* run's version step succeeded (git tagged/pushed) but its npm publish step
      # failed partway through a batch, since lerna version and npm publish are not atomic together.
      #
      # Retries only Sigstore's TLOG_CREATE_ENTRY_ERROR (409). When Rekor is slow to answer, npm's
      # Sigstore client re-sends the provenance entry it already logged, gets "an equivalent entry
      # already exists", and aborts before uploading (npm/cli#10078, sigstore/sigstore-js#1708).
      # Retrying is safe: npm signs before it uploads, so the failed package was never published,
      # and from-package skips every version that already is.
      #
      # Before each retry it restores the package.json files from git. To publish, lerna rewrites each
      # workspace: dependency to a plain range, and an aborted attempt leaves them rewritten. pnpm exec
      # then refuses to run, because they no longer match pnpm-lock.yaml (ERR_PNPM_OUTDATED_LOCKFILE).
      # The version step above has already committed and pushed, so these files have nothing else to lose.
      - name: Publish
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/lerna-publish.log"
          for attempt in 1 2 3; do
            if pnpm exec lerna publish from-package --yes 2>&1 | tee "$log"; then
              exit 0
            fi
            if ! grep -q TLOG_CREATE_ENTRY_ERROR "$log"; then
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Sigstore rejected a re-sent provenance entry (attempt $attempt of 3). Retrying in 30 seconds."
              git checkout -- package.json 'packages/*/package.json'
              sleep 30
            fi
          done
          echo "::error::Sigstore kept rejecting the provenance entry after 3 attempts. Re-run the workflow; from-package picks up what's left."
          exit 1
        env:
          NPM_CONFIG_PROVENANCE: true
